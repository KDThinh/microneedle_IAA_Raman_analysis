profiles:
  # ============================================================================
  # SHARED BASE PROFILE
  # ============================================================================
  processing_default:
    description: Base profile with common processing parameters shared across all
      profiles.
    data_source:
      requires_google_drive: false
    processing:
      # Spectral preprocessing (per-scan Raman spectrum)
      excitation_nm: 830
      recorded_excitation_nm: 830
      spectral_sg_window: 25
      spectral_sg_poly_order: 2
      spectral_lieberfit_poly_order: 7
      spectral_lieberfit_iterations: 50

      # Time-series smoothing (applied after spectral extraction)
      timeseries_smoothing_method: savitzky #or gaussian
      timeseries_sg_window: 5
      timeseries_sg_poly_order: 2
      timeseries_gaussian_sigma: 5

      # Spike removal (Hampel filter settings)
      spike_window: 3
      spike_threshold: 3.0
      spike_min_length: 1
      spike_max_length: 20

      # Baseline jump detection and correction
      baseline_correction_threshold: 5
      baseline_correction_window: 15
      baseline_detect_cumulative_jumps: true
      baseline_cumulative_window: 5

      # FFT preprocessing and peak reporting
      fft_gaussian_sigma: 50
      fft_als_lambda: 100000000
      fft_als_p: 0.0001
      fft_als_iterations: 20
      fft_top_peaks: 10

      # Scan trimming
      skip_scans_before: 500
      skip_scans_after: 0

