# Default configuration for microneedle analysis

exposure_per_frame: 30  # seconds per frame (global for all time axes)

background_subtraction:
  radius: 25
  visualize: true

detection:
  min_distance: 4
  threshold_rel: 0.2
  visualize: true

tracking:
  spots_to_track: null  # null = track all spots
  search_range: 10  # ROI search radius (pixels)
  diameter: 5  # Spot diameter for intensity calculation
  min_distance: 3  # Minimum distance separating peaks
  threshold_rel: 0.5  # Relative threshold for peak detection
  background_roi: null  # Background ROI as [y_min, y_max, x_min, x_max]. null = exclude spots from whole frame
  skip_initial_frames: 25  # Number of frames to skip at start of stack (0 = use all from start)
  max_frame: null  # null = process full stack; integer = max frame index (exclusive) after skip

normalization:
  starting_frame: 100
  ending_frame: 300

visualization:
  exposure_per_frame: 30  # seconds per frame
  format: svg
  # Optional y-axis limits [ymin, ymax] for all four subplots of ratiometric_IAA_Ref (folder IAA/Ref workflow).
  # ratiometric_iaa_ref_ylim: [0.5, 1.5]

# Cohort QC across tracked tips (per TIFF): LOO median, RMS, robust flags; figures + cohort_qc.csv in output dir.
cohort_qc:
  enabled: true
  # threshold on RMS distances: median(d) + mad_lambda * 1.4826 * MAD(d); MAD is computed from data each run.
  mad_lambda: 2.0

smoothing:
  exposure_per_frame: 30  # seconds per frame
  alpha: 0.05
  min_time_range: [210, 700]  # minutes
  # Used by visualization/intensity_curves helpers only; main pipeline does not apply post-norm drift correction.
  n_frames_baseline: 50
  # Trend overlays on cohort_qc_before_after (LOWESS, Savitzky-Golay, rolling mean on primary median/mean curve).
  trend_smoothing:
    enabled: true
    lowess_frac: 0.2
    savgol_window: 51
    savgol_polyorder: 3
    rolling_window: 50

correlation:
  reference_idx: 0  # index of reference spot for distance calculation

artifact_correction:
  enabled: true
  window: 10
  sigma_threshold: 5
  max_iter: 10

