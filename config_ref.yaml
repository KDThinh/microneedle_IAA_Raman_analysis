# Fig-3 IAA/Ref paired processing - folder-based, discovers IAA and Ref .tif files by keyword
  fig3_bokchoi_main_figure_iaa_ref_exp1:
    profile_type: folder_keywords
    folder_path: 'G:\My Drive\Work\DiSTAP\Research\Auxin IAA\IAA-MN Nat Comm\Image data\Main Figures\Fig3_Bokchoy\Main Fig3g'
    file_keywords: ['IAA', 'Ref']  # Keywords to match .tif files (case-insensitive)
    exposure_per_frame: 5
    skip_initial_frames: 0
    normalization_starting_frame: 0
    normalization_ending_frame: 900
    visualization:
      ratiometric_iaa_ref_ylim: [0.9, 1.1]
    output_subdirs: ['IAA_output', 'Ref_output']  # Maps keyword -> output subfolder
    # Per-keyword spots_to_track (optional): use spots_to_track_IAA, spots_to_track_Ref, or spots_to_track for both
