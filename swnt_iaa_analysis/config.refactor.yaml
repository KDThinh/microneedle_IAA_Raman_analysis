profiles:
  processing_default:
    description: Base profile with common processing parameters shared across all
      profiles.
    data_source:
      requires_google_drive: false
    processing:
      excitation_nm: 830
      recorded_excitation_nm: 830
      window_size: 25
      poly_order_sg: 2
      poly_order: 7
      tot_iter: 50
      timeseries_smoothing_method: savitzky
      timeseries_sg_window: 15
      timeseries_sg_poly_order: 2
      timeseries_gaussian_sigma: 5
      spike_window: 3
      spike_threshold: 3.0
      spike_min_length: 1
      spike_max_length: 20
      baseline_correction_threshold: 5
      baseline_correction_window: 80
      baseline_detect_cumulative_jumps: true
      baseline_cumulative_window: 5
      sigma_gaussian: 50
      lam_als: 100000000
      p_als: 0.0001
      niter_als: 20
      fft_top_peaks: 10
      skip_scans_bef: 500
      skip_scans_end: 0
  in_planta_gaussian_template:
    description: 'Template: shared gaussian time-series defaults for in-planta profiles.'
    inherits: processing_default
    processing:
      timeseries_smoothing_method: gaussian
      timeseries_sg_window: 15
      timeseries_sg_poly_order: 2
      timeseries_gaussian_sigma: 5
      spike_window: 5
      spike_threshold: 10.0
      spike_min_length: 1
      spike_max_length: 20
      baseline_correction_threshold: 5
      baseline_correction_window: 80
      baseline_detect_cumulative_jumps: true
      baseline_cumulative_window: 5
      sigma_gaussian: 30
      lam_als: 100000000
      p_als: 0.01
      niter_als: 20
      fft_top_peaks: 10
    outputs:
      timeseries_x_axis: datetime
  Nb_petiole_feeding_run1:
    description: IAA solution is fed into a cut petiole via syringe system, done at
      DiSTAP.
    inherits: processing_default
    data_source:
      raman_relative_path: IAA Nanosensor Experiment\Petiole Feeding\run 1\run 1 rep.txt
    metadata:
      experiment: petiole feeding
      plant_type: Nb
      treatment: Petiole Feeding
      replicate_number: 1
    outputs:
      timeseries_x_axis: scan_number
