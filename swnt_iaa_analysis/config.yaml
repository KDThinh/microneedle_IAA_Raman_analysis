profiles:
  # ============================================================================
  # BASE PROFILES - Shared processing parameters
  # ============================================================================
  
  processing_default:
    description: Base profile with common processing parameters shared across all profiles.
    data_source:
      requires_google_drive: false  # Use paths relative to current working directory instead
    processing:
      # ========================================================================
      # Spectroscopy/Excitation Parameters
      # ========================================================================
      excitation_nm: 830  # Laser excitation wavelength (nm) - The laser you ACTUALLY used
      recorded_excitation_nm: 830  # The laser the file metadata implies (raw text files usually come from a device set to 785nm)
      
      # ========================================================================
      # Spectral Processing (per-scan)
      # ========================================================================
      # Savitzky-Golay Smoothing for smoothing raw spectral data
      window_size: 25    # Window size for Savitzky-Golay smoothing
      poly_order_sg: 2   # Polynomial order for Savitzky-Golay filter
      
      # LieberFit Baseline Correction (Iterative Polynomial) for isolating Raman signal from background
      poly_order: 7   # Polynomial order for LieberFit baseline correction
      tot_iter: 50    # Number of iterations for LieberFit algorithm
      
      # ========================================================================
      # Time-series Processing (applied in order: smoothing → spike removal → baseline correction)
      # ========================================================================
      # Time-series Smoothing (before spike removal)
      timeseries_smoothing_method: gaussian  # 'savitzky' or 'gaussian'
      timeseries_sg_window: 15       # Window size for Savitzky-Golay smoothing of time-series (must be odd)
      timeseries_sg_poly_order: 2   # Polynomial order for Savitzky-Golay smoothing of time-series
      timeseries_gaussian_sigma: 5  # Sigma for Gaussian smoothing if method='gaussian'
      
      # Spike Removal (Hampel Filter) - Applied after time-series smoothing
      spike_window: 3        # Half-window size for median calculation in spike detection
      spike_threshold: 3.0   # Threshold in units of MAD (Median Absolute Deviation) for outlier detection
      spike_min_length: 1    # Minimum consecutive points to consider as a spike (in scans)
      spike_max_length: 20   # Maximum consecutive points to replace as one spike (increase to catch long spikes)
      
      # Baseline Drift Correction (step discontinuity removal) - Applied after spike removal
      baseline_correction_threshold: 5       # MAD threshold multiplier for jump detection
      baseline_correction_window: 80           # Number of points to average before/after jump for offset calculation
      baseline_detect_cumulative_jumps: true  # If True, also detect gradual jumps over multiple consecutive points
      baseline_cumulative_window: 5           # Window size for detecting cumulative/gradual jumps (total change over N consecutive points)
      
      # ========================================================================
      # FFT Analysis Parameters
      # ========================================================================
      # Gaussian Smoothing for FFT preprocessing
      sigma_gaussian: 50  # Standard deviation for Gaussian smoothing (sigma)
      
      # ALS (Asymmetric Least Squares) Baseline Correction for removing long-term trends before FFT
      lam_als: 100000000  # Lambda parameter (smoothness penalty)
      p_als: 0.000100     # Asymmetry parameter (0 < p < 1)
      niter_als: 20       # Number of ALS iterations
      
      # FFT Peak Extraction
      fft_top_peaks: 10    # Number of top peaks to extract from FFT analysis
      
      # ========================================================================
      # Data Processing
      # ========================================================================
      skip_scans_bef: 500  # Number of scans to skip from the beginning (default: 500)
      skip_scans_end: 0    # Number of scans to skip from the end (default: 0)

