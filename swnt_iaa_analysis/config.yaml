profiles:
  # ============================================================================
  # BASE PROFILES - Shared processing parameters
  # ============================================================================
  
  processing_default:
    description: Base profile with common processing parameters shared across all profiles.
    data_source:
      requires_google_drive: false  # Use paths relative to current working directory instead
    processing:
      # ========================================================================
      # Spectroscopy/Excitation Parameters
      # ========================================================================
      excitation_nm: 830  # Laser excitation wavelength (nm) - The laser you ACTUALLY used
      recorded_excitation_nm: 830  # The laser the file metadata implies (raw text files usually come from a device set to 785nm)
      
      # ========================================================================
      # Emission Wavelength Ranges (wavenumber regions in cm^-1)
      # ========================================================================
      bg_emission_min: 850      # Background region start
      bg_emission_max: 925      # Background region end
      fluo_emission_min: 925    # Fluorescence region start
      fluo_emission_max: 1000   # Fluorescence region end
      gband_emission_min: 952   # G-band region start
      gband_emission_max: 960   # G-band region end
      
      # ========================================================================
      # LieberFit Baseline Correction (Iterative Polynomial) for isolating Raman signal from background
      # ========================================================================
      poly_order: 7   # Polynomial order for LieberFit baseline correction
      tot_iter: 50    # Number of iterations for LieberFit algorithm
      
      # ========================================================================
      # Savitzky-Golay Smoothing for smoothing the raw data
      # ========================================================================
      window_size: 25    # Window size for Savitzky-Golay smoothing
      poly_order_sg: 2   # Polynomial order for Savitzky-Golay filter
      
      # ========================================================================
      # ALS (Asymmetric Least Squares) Baseline Correction for removing long term trends for Fourier transform analysis
      # ========================================================================
      lam_als: 100000000  # Lambda parameter (smoothness penalty)
      p_als: 0.000100     # Asymmetry parameter (0 < p < 1)
      niter_als: 20       # Number of ALS iterations
      
      # ========================================================================
      # Gaussian Smoothing Parameters for smoothing the data for Fourier transform analysis
      # ========================================================================
      sigma_gaussian: 50              # Standard Gaussian smoothing (sigma)
      sigma_gaussian_stacked: 50      # Stacked Gaussian smoothing (sigma)
      sigma_gaussian_extrema: 50      # Extrema Gaussian smoothing (sigma)
      
      # ========================================================================
      # Peak Detection of Raman peaks
      # ========================================================================
      peak_distance: 100  # Minimum distance between detected peaks
      
      # ========================================================================
      # Baseline Drift Correction (for time-series data - step discontinuity removal)
      # ========================================================================
      baseline_correction_threshold: 15       # MAD threshold multiplier for jump detection
      baseline_correction_window: 5           # Number of points to average before/after jump for offset calculation
      baseline_correction_smooth_first: true   # If True, smooth signal before jump detection
      baseline_correction_smooth_window: 5    # Window size for Savitzky-Golay smoothing before jump detection (must be odd)
      baseline_correction_smooth_poly_order: 2 # Polynomial order for Savitzky-Golay smoothing before jump detection
      baseline_correction_correct_smoothed: true # If True, apply correction to smoothed signal; if False, to original signal
      
      # ========================================================================
      # Data Processing/Analysis
      # ========================================================================
      bin_factor: 2        # Binning factor for data reduction
      fft_top_peaks: 10    # Number of top peaks to extract from FFT analysis
      skip_scans: 500     # Number of scans to skip from the beginning (default: 500)
